<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Coin</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080e1d;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;
 padding:22px;
 font-size:27px;
 font-weight:bold;
 color:#42e8b5;
}
.container{padding:18px;padding-bottom:35px}
.balance{
 background:linear-gradient(135deg,#155e75,#065f46);
 padding:25px;
 border-radius:22px;
 text-align:center;
}
.balance small{font-size:14px}
#coins{
 font-size:43px;
 font-weight:bold;
 margin:10px;
}
.tap{
 display:block;
 width:190px;
 height:190px;
 margin:35px auto;
 border-radius:50%;
 border:7px solid #42e8b5;
 background:linear-gradient(135deg,#164e63,#087f67);
 color:white;
 font-size:29px;
 font-weight:bold;
 box-shadow:0 0 30px #20d6aa;
 cursor:pointer;
}
.tap:active{transform:scale(.94)}
.card{
 background:#151f33;
 padding:20px;
 border-radius:18px;
 margin-top:16px;
 text-align:center;
}
button.upgrade{
 background:#e5a928;
 color:#111827;
 border:0;
 padding:14px 25px;
 border-radius:12px;
 font-size:17px;
 font-weight:bold;
 margin-top:10px;
}
button:disabled{
 opacity:.5;
}
.stats{
 display:flex;
 justify-content:space-between;
 gap:10px;
}
.stats .card{flex:1}
</style>
</head>
<body>

<header>🪙 TAP COIN</header>

<div class="container">

 <div class="balance">
  <small>YOUR TOTAL BALANCE</small>
  <div id="coins">0</div>
  <small>🪙 TOTAL COINS</small>
 </div>

 <button class="tap" onclick="tapCoin()">
  TAP<br>+<span id="power">1</span>
 </button>

 <div class="stats">
  <div class="card">
   <small>⚡ TAP POWER</small>
   <h2 id="powerText">+1</h2>
  </div>
  <div class="card">
   <small>🚀 LEVEL</small>
   <h2 id="level">1</h2>
  </div>
 </div>

 <div class="card">
  <h2>🚀 COIN UPGRADE</h2>
  <p>Upgrade করলে প্রতি TAP-এ বেশি Coin পাবে।</p>
  <h3>Price: <span id="price">100</span> Coins</h3>
  <button class="upgrade" id="upgradeBtn"
  onclick="upgradePower()">UPGRADE</button>
 </div>

 <div class="card">
  <h3>💾 Your Coins Are Saved</h3>
  <p>তোমার Coin এই ডিভাইসে সেভ থাকবে।</p>
 </div>

</div>

<script>
let coins = Number(localStorage.getItem("tapCoins") || 0);
let power = Number(localStorage.getItem("tapPower") || 1);
let level = Number(localStorage.getItem("tapLevel") || 1);
let price = Number(localStorage.getItem("tapPrice") || 100);

function save(){
 localStorage.setItem("tapCoins",coins);
 localStorage.setItem("tapPower",power);
 localStorage.setItem("tapLevel",level);
 localStorage.setItem("tapPrice",price);
}

function update(){
 document.getElementById("coins").innerText=coins.toLocaleString();
 document.getElementById("power").innerText=power;
 document.getElementById("powerText").innerText="+"+power;
 document.getElementById("level").innerText=level;
 document.getElementById("price").innerText=price;
 document.getElementById("upgradeBtn").disabled=coins<price;
}

function tapCoin(){
 coins+=power;
 save();
 update();
}

function upgradePower(){
 if(coins<price)return;
 coins-=price;
 power++;
 level++;
 price*=2;
 save();
 update();
 alert("Upgrade Successful! Now +" + power + " Coin per Tap!");
}

update();
</script>

</body>
</html>
