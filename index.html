<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAP COIN</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0c1422;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;
 min-height:100vh;align-items:center;padding:20px
}
.card{
 width:100%;max-width:380px;background:#172438;
 padding:25px;border-radius:18px;
 box-shadow:0 5px 25px #0008
}
h1{text-align:center;color:#f5c542}
input,button{
 width:100%;padding:14px;margin:9px 0;
 border:0;border-radius:9px;font-size:16px
}
input{background:#263950;color:white}
button{background:#f5c542;font-weight:bold}
#message{text-align:center;color:#f5c542}
</style>
</head>
<body>
<div class="card">
<h1>🪙 TAP COIN</h1>
<h3>Login / Registration</h3>

<input id="name" placeholder="Your Name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="register">CREATE ACCOUNT</button>
<button id="login">LOGIN</button>
<p id="message">Welcome to TAP COIN</p>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,updateProfile
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
 getFirestore,doc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDtXQI_wAaZQ7ockqXhC7tK6wvNwdCUUPQ",
 authDomain: "tap-coin-6d526.firebaseapp.com",
 projectId: "tap-coin-6d526",
 storageBucket: "tap-coin-6d526.firebasestorage.app",
 messagingSenderId: "170772485510",
 appId: "1:170772485510:web:f95accc6dbe4a6fb95c807",
 measurementId: "G-DMH1KPBXFD"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const message=document.getElementById("message");

document.getElementById("register").onclick=async()=>{
 const name=document.getElementById("name").value.trim();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 try{
  if(!name) throw new Error("Enter your name");
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await updateProfile(result.user,{displayName:name});
  await setDoc(doc(db,"users",result.user.uid),{
   displayName:name,
   coins:0,
   createdAt:serverTimestamp()
  });
  message.textContent="Account created successfully!";
 }catch(error){
  message.textContent=error.message;
 }
};

document.getElementById("login").onclick=async()=>{
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 try{
  await signInWithEmailAndPassword(auth,email,password);
  message.textContent="Login successful!";
 }catch(error){
  message.textContent=error.message;
 }
};
</script>
</body>
</html>

<section id="adminPanel" style="
display:none;background:#101827;color:white;
padding:20px;border-radius:15px;margin:15px auto;
max-width:600px;font-family:Arial">

<h2 style="color:#f5c542;text-align:center">
🛡️ TAP COIN ADMIN

<div style="display:flex;gap:10px;flex-wrap:wrap">
 <div style="background:#24364d;padding:18px;border-radius:12px;flex:1">

 </div>
 <div style="background:#24364d;padding:18px;border-radius:12px;flex:1">

 </div>
</div>

width:100%;padding:13px;margin-top:15px;
background:#f5c542;border:0;border-radius:8px">
LOGOUT
</button>
</section>

<script type="module">
// এই প্যানেলটি নিরাপদ Firebase Admin
// authorization এবং Rules যুক্ত করার পর চালু করতে হবে.
// Client-side HTML নিজে Admin অনুমতি নির্ধারণ করে না.
import { getAuth, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

const auth = getAuth();

const panel = document.getElementById("adminPanel");

onAuthStateChanged(auth, user => {
  if (!user) {
    panel.style.display = "none";
    return;
  }

  // Admin permission server-side যাচাই না হওয়া পর্যন্ত
  // Admin panel লুকানো থাকবে।
  panel.style.display = "none";
});

document.getElementById("adminLogout").onclick = async () => {
  await signOut(auth);
};
</script>

<div style="background:#172438;color:white;padding:20px;border-radius:15px;font-family:Arial">
  <h2 style="color:#f5c542;text-align:center">🪙 TAP COIN</h2>
  <input id="guestName" placeholder="Enter Username" style="width:100%;padding:13px;margin:8px 0;box-sizing:border-box">
  <button id="guestBtn" style="width:100%;padding:13px;background:#f5c542;border:0;border-radius:8px">CREATE GUEST ACCOUNT</button>
  <p id="statusMsg">Welcome to TAP COIN</p>
  <p id="myUid" style="font-size:12px;word-break:break-all"></p>
  <hr>
  <div id="adminPanel" style="display:none">
    <h2 style="color:#f5c542">🛡️ ADMIN DASHBOARD</h2>
    <h3>Total Users: <span id="totalUsers">0</span></h3>
    <h3>Total Demo Coins: <span id="totalCoins">0</span></h3>
    <div id="userList">Loading users...</div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp,
  collection, getDocs, updateDoc
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtXQI_wAaZQ7ockqXhC7T6K6wvNwdCUUPQ",
  authDomain: "tap-coin-6d526.firebaseapp.com",
  projectId: "tap-coin-6d526",
  storageBucket: "tap-coin-6d526.firebasestorage.app",
  messagingSenderId: "170772485510",
  appId: "1:170772485510:web:f95accc6dbe4a6fb95c807",
  measurementId: "G-DMH1KPBXFD"
};

// প্রথম Guest Account খোলার পর নিজের UID দিয়ে এটি বদলাবে।
const ADMIN_UID = "PASTE_YOUR_ADMIN_UID_HERE";

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const msg = document.getElementById("statusMsg");
const uidBox = document.getElementById("myUid");
const panel = document.getElementById("adminPanel");

document.getElementById("guestBtn").onclick = async () => {
  const name = document.getElementById("guestName").value.trim();
  if (!name) {
    msg.textContent = "Please enter a username.";
    return;
  }

  try {
    msg.textContent = "Creating account...";
    const result = await signInAnonymously(auth);
    const user = result.user;
    const ref = doc(db, "users", user.uid);
    const existing = await getDoc(ref);

    if (!existing.exists()) {
      await setDoc(ref, {
        uid: user.uid,
        displayName: name,
        coins: 0,
        status: "active",
        createdAt: serverTimestamp()
      });
    }

    msg.textContent = "Guest account ready!";
    uidBox.textContent = "Your User ID: " + user.uid;
    await showAdmin(user.uid);
  } catch (error) {
    msg.textContent = "Error: " + error.message;
  }
};

onAuthStateChanged(auth, async user => {
  if (!user) {
    panel.style.display = "none";
    return;
  }
  uidBox.textContent = "Your User ID: " + user.uid;
  await showAdmin(user.uid);
});

async function showAdmin(uid) {
  if (uid !== ADMIN_UID || ADMIN_UID === "PASTE_YOUR_ADMIN_UID_HERE") {
    panel.style.display = "none";
    return;
  }

  panel.style.display = "block";
  const list = document.getElementById("userList");
  list.textContent = "Loading users...";

  try {
    const snapshot = await getDocs(collection(db, "users"));
    let totalCoins = 0;
    list.innerHTML = "";

    snapshot.forEach(item => {
      const u = item.data();
      totalCoins += Number(u.coins || 0);

      const row = document.createElement("div");
      row.style.cssText = "background:#263950;padding:12px;margin:10px 0;border-radius:9px;overflow-wrap:anywhere";

      const info = document.createElement("p");
      info.textContent = `${u.displayName || "Guest"} | ID: ${u.uid} | Coins: ${u.coins || 0} | ${u.status || "active"}`;

      const add = document.createElement("button");
      add.textContent = "+100 Demo Coins";
      add.onclick = async () => {
        await updateDoc(doc(db, "users", u.uid), {
          coins: Number(u.coins || 0) + 100
        });
        await showAdmin(uid);
      };

      const block = document.createElement("button");
      block.textContent = u.status === "blocked" ? "Unblock User" : "Block User";
      block.onclick = async () => {
        await updateDoc(doc(db, "users", u.uid), {
          status: u.status === "blocked" ? "active" : "blocked"
        });
        await showAdmin(uid);
      };

      row.append(info, add, block);
      list.appendChild(row);
    });

    document.getElementById("totalUsers").textContent = snapshot.size;
    document.getElementById("totalCoins").textContent = totalCoins;
  } catch (error) {
    list.textContent = "Admin access not configured: " + error.message;
  }
}
</script>
