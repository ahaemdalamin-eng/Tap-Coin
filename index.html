<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAP COIN</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0c1422;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;
 min-height:100vh;align-items:center;padding:20px
}
.card{
 width:100%;max-width:380px;background:#172438;
 padding:25px;border-radius:18px;
 box-shadow:0 5px 25px #0008
}
h1{text-align:center;color:#f5c542}
input,button{
 width:100%;padding:14px;margin:9px 0;
 border:0;border-radius:9px;font-size:16px
}
input{background:#263950;color:white}
button{background:#f5c542;font-weight:bold}
#message{text-align:center;color:#f5c542}
</style>
</head>
<body>
<div class="card">
<h1>🪙 TAP COIN</h1>
<h3>Login / Registration</h3>

<input id="name" placeholder="Your Name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="register">CREATE ACCOUNT</button>
<button id="login">LOGIN</button>
<p id="message">Welcome to TAP COIN</p>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,updateProfile
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
 getFirestore,doc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDtXQI_wAaZQ7ockqXhC7tK6wvNwdCUUPQ",
 authDomain: "tap-coin-6d526.firebaseapp.com",
 projectId: "tap-coin-6d526",
 storageBucket: "tap-coin-6d526.firebasestorage.app",
 messagingSenderId: "170772485510",
 appId: "1:170772485510:web:f95accc6dbe4a6fb95c807",
 measurementId: "G-DMH1KPBXFD"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const message=document.getElementById("message");

document.getElementById("register").onclick=async()=>{
 const name=document.getElementById("name").value.trim();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 try{
  if(!name) throw new Error("Enter your name");
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await updateProfile(result.user,{displayName:name});
  await setDoc(doc(db,"users",result.user.uid),{
   displayName:name,
   coins:0,
   createdAt:serverTimestamp()
  });
  message.textContent="Account created successfully!";
 }catch(error){
  message.textContent=error.message;
 }
};

document.getElementById("login").onclick=async()=>{
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 try{
  await signInWithEmailAndPassword(auth,email,password);
  message.textContent="Login successful!";
 }catch(error){
  message.textContent=error.message;
 }
};
</script>
</body>
</html>
